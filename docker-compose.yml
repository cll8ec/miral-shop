

services:
  # تطبيق لارافيل
  app:
    ports:
      - "8000:8000"
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-app
    container_name: miral_store_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - laravel

  # قاعدة البيانات MySQL
  db:
    image: mysql:latest    # تم التغيير لاستخدام أحدث إصدار
    container_name: miral_store_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_USER: '${DB_USERNAME}'
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel

networks:
  laravel:
    driver: bridge

volumes:
  dbdata:
    driver: local